version: 2
updates:
  # Configuration for Gradle
  - package-ecosystem: "gradle"
    directory: "/" # Location of build.gradle
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
